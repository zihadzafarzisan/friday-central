<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FRIDAY â€” Student OS</title>
  <meta name="description" content="Your personalised student portal for university life: schedule, deadlines, notices, and degree progress in one calm place." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;850;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --text-muted: #8e8e8e;
      --text-subtle: #5f5f5f;
      --border: rgba(255, 255, 255, 0.14);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --surface-active: rgba(255, 255, 255, 0.12);
      --chip-bg: rgba(255, 255, 255, 0.05);
      --btn-white-bg: #ffffff;
      --btn-white-text: #000000;
      --btn-dark-bg: rgba(255, 255, 255, 0.1);
      --btn-dark-text: #ffffff;
      --watermark-color: rgba(255, 255, 255, 0.045);
      --watermark-shadow: 0 0 35px rgba(255, 255, 255, 0.22), 0 0 80px rgba(255, 255, 255, 0.12);
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --text: #000000;
      --text-muted: #555555;
      --text-subtle: #999999;
      --border: rgba(0, 0, 0, 0.14);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --surface-hover: rgba(0, 0, 0, 0.06);
      --surface-active: rgba(0, 0, 0, 0.1);
      --chip-bg: rgba(0, 0, 0, 0.04);
      --btn-white-bg: #000000;
      --btn-white-text: #ffffff;
      --btn-dark-bg: rgba(0, 0, 0, 0.06);
      --btn-dark-text: #000000;
      --watermark-color: rgba(0, 0, 0, 0.045);
      --watermark-shadow: 0 0 35px rgba(0, 0, 0, 0.12), 0 0 70px rgba(0, 0, 0, 0.06);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
      -webkit-font-smoothing: antialiased;
    }

    /* Layout Shell */
    .portal-shell {
      position: relative;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    /* Left Sidebar (Floating, Does not push center content) */
    .sidebar {
      position: fixed;
      left: 18px;
      top: 20px;
      bottom: 20px;
      width: 210px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 10px 10px 10px 0;
      background: transparent;
      transition: width 0.22s cubic-bezier(0.2, 0, 0, 1);
    }

    .sidebar.collapsed {
      width: 52px;
    }

    /* Sidebar Logo Slot */
    .logo-slot {
      height: 44px;
      width: 100%;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 4px;
      background: transparent;
    }

    .sidebar-logo-img {
      max-height: 42px;
      max-width: 145px;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      filter: invert(1) drop-shadow(0 0 14px rgba(255, 255, 255, 0.35));
      transition: opacity 0.2s ease, transform 0.2s ease, filter 0.2s ease;
    }

    .sidebar.collapsed .sidebar-logo-img {
      max-height: 24px;
      max-width: 44px;
    }

    [data-theme="light"] .sidebar-logo-img {
      filter: drop-shadow(0 0 4px rgba(0, 0, 0, 0.1));
    }

    /* Section Titles */
    .section-title {
      margin: 8px 6px 3px;
      color: var(--text);
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      transition: opacity 0.15s ease;
    }

    .sidebar.collapsed .section-title {
      display: none;
    }

    /* Navigation Lists */
    .nav-list {
      display: grid;
      gap: 1px;
      list-style: none;
    }

    .nav-item {
      display: flex;
    }

    .nav-button {
      width: 100%;
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid transparent;
      border-radius: 7px;
      padding: 4px 7px;
      color: var(--text);
      background: transparent;
      font: 500 13px 'Inter', sans-serif;
      text-align: left;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      background: var(--surface-hover);
      color: var(--text);
    }

    .sidebar.collapsed .nav-button {
      justify-content: center;
      padding: 5px 0;
    }

    .sidebar.collapsed .nav-button span:last-child {
      display: none;
    }

    .nav-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      flex: 0 0 18px;
      color: var(--text);
    }

    .nav-icon svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    /* Sub-list */
    .sub-list {
      display: grid;
      gap: 1px;
      padding-left: 32px;
      margin: 1px 0 3px;
      list-style: none;
    }

    .sidebar.collapsed .sub-list {
      display: none;
    }

    .sub-button {
      min-height: 24px;
      border: 0;
      border-radius: 5px;
      padding: 2px 6px;
      color: var(--text-muted);
      background: transparent;
      font: 450 12.5px 'Inter', sans-serif;
      text-align: left;
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .sub-button:hover,
    .sub-button:focus-visible {
      color: var(--text);
      background: var(--surface-hover);
    }

    /* Collapse Arrow Toggle Button */
    .collapse-toggle {
      margin-top: auto;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 6px 7px;
      background: transparent;
      border: 0;
      border-radius: 7px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s ease, background-color 0.15s ease;
    }

    .collapse-toggle:hover,
    .collapse-toggle:focus-visible {
      color: var(--text);
      background: var(--surface-hover);
    }

    .sidebar.collapsed .collapse-toggle {
      justify-content: center;
      padding: 8px 0;
    }

    .collapse-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      transition: transform 0.2s ease;
    }

    .sidebar.collapsed .collapse-icon {
      transform: rotate(180deg);
    }

    /* Main Area (Centered) */
    .main-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 70px;
      min-height: 100vh;
      width: 100%;
    }

    /* Top Bar */
    .topbar {
      position: absolute;
      top: 20px;
      right: 24px;
      z-index: 20;
      display: flex;
      align-items: center;
      min-height: 44px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid transparent;
      border-radius: 12px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      background: var(--surface-hover);
    }

    .icon-btn svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    /* Banknote Watermark (Solid White Shadow) */
    .watermark-container {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      overflow: hidden;
    }

    .watermark-text {
      font-size: clamp(90px, 19vw, 220px);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      color: var(--watermark-color);
      text-shadow: var(--watermark-shadow);
      text-align: center;
      transform: translateY(-24px);
    }

    /* Centered Hero */
    .hero-container {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      max-width: 820px;
      width: 100%;
      margin: auto 0;
      padding: 10px 16px;
    }

    .welcome-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      background: var(--chip-bg);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .brand-title {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-img {
      width: 100%;
      max-width: 440px;
      max-height: 140px;
      height: auto;
      display: block;
      margin: 0 auto;
      user-select: none;
      filter: invert(1) drop-shadow(0 0 28px rgba(255, 255, 255, 0.38));
      transition: filter 0.2s ease;
    }

    [data-theme="light"] .hero-logo-img {
      filter: drop-shadow(0 0 12px rgba(0, 0, 0, 0.12));
    }

    .hero-description {
      font-size: 16px;
      line-height: 1.62;
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 12px;
    }

    .quote-pill {
      display: inline-flex;
      align-items: center;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--chip-bg);
      border: 1px solid var(--border-subtle);
      margin-bottom: 12px;
    }

    .sub-meta {
      font-size: 12px;
      color: var(--text-subtle);
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sub-meta button {
      color: var(--text-muted);
      background: none;
      border: none;
      font: inherit;
      cursor: pointer;
      padding: 0 2px;
      transition: color 0.15s ease;
    }

    .sub-meta button:hover {
      color: var(--text);
      text-decoration: underline;
    }

    /* Action Buttons */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 34px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--btn-white-bg);
      color: var(--btn-white-text);
      font-size: 13.5px;
      font-weight: 600;
      border: 1px solid var(--btn-white-bg);
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s ease;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 24px;
      border-radius: 999px;
      background: var(--btn-dark-bg);
      color: var(--btn-dark-text);
      font-size: 13.5px;
      font-weight: 500;
      border: 1px solid var(--border);
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.15s ease;
    }

    .btn-secondary:hover {
      background: var(--surface-active);
    }

    /* Quick Chips */
    .quick-chips {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .quick-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 15px;
      border-radius: 999px;
      font-size: 12px;
      color: var(--text-muted);
      background: var(--chip-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease, background-color 0.15s ease;
    }

    .quick-chip:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .quick-chip svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
    }

    /* Centered Bottom Navigation */
    .bottom-links {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      z-index: 20;
    }

    .bottom-links button {
      min-height: 32px;
      border: 0;
      background: transparent;
      padding: 4px 6px;
      color: var(--text-muted);
      font: 500 13px 'Inter', sans-serif;
      cursor: pointer;
      transition: color 0.15s ease;
    }

    .bottom-links button:hover,
    .bottom-links button:focus-visible {
      color: var(--text);
    }

    /* Accessible Focus Ring */
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* Mobile Breakpoint */
    @media (max-width: 768px) {
      .portal-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        flex-direction: row;
        align-items: center;
        padding: 12px 16px;
        overflow-x: auto;
      }

      .sidebar.collapsed {
        width: 100%;
      }

      .logo-slot {
        width: 60px;
        height: 40px;
        margin-bottom: 0;
        margin-right: 10px;
        flex-shrink: 0;
      }

      .section-title,
      .sub-list,
      .collapse-toggle {
        display: none;
      }

      .nav-list {
        display: flex;
        flex-direction: row;
        gap: 6px;
      }

      .nav-button span:last-child {
        display: none;
      }

      .nav-button {
        padding: 8px;
      }

      .main-content {
        padding: 16px 20px 80px;
      }

      .bottom-links {
        left: 0;
        bottom: 12px;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <div class="portal-shell">
    <!-- Left Navigation Panel (Transparent Background) -->
    <aside class="sidebar" id="portalSidebar" aria-label="FRIDAY Navigation">
      <div class="logo-slot" aria-label="FRIDAY Logo">
        <img src="/files/black.png" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='/files/black.png';}" alt="FRIDAY logo" class="sidebar-logo-img" />
      </div>

      <p class="section-title">Services</p>
      <ul class="nav-list" aria-label="Services navigation">
        <li class="nav-item">

            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h2M14 14h2M8 17h2M14 17h2"/></svg>
            </span>
            <span>Schedules</span>

        <li><button class="sub-button" type="button">Exam</button></li>
      </ul>

      <ul class="nav-list">
        <li class="nav-item">
          <button class="nav-button" type="button">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>
            </span>
            <span>Deadlines</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-button" type="button">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            </span>
            <span>Notices</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-button" type="button">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><path d="m9 11 3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            </span>
            <span>Attendance</span>

        </li>
        <li class="nav-item">
          <button class="nav-button" type="button">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
            </span>
            <span>Assistant</span>
          </button>
        </li>
      </ul>

      <p class="section-title">Advising</p>
      <ul class="nav-list" aria-label="Advising navigation">
        <li class="nav-item">
          <button class="nav-button" type="button">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c0 3 3 5 6 5s6-2 6-5v-5"/><path d="M22 10v6"/></svg>
            </span>
            <span>Degree Progress</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-button" type="button">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            </span>
            <span>Registration Copilot</span>
          </button>
        </li>
        <li class="nav-item">
          <button class="nav-button" type="button">
            <span class="nav-icon">
              <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m9 15 2 2 4-4"/></svg>
            </span>
            <span>Semester Planner</span>
          </button>
        </li>
      </ul>

      <!-- Bottom Arrow Collapse Toggle -->
      <button class="collapse-toggle" id="sidebarToggle" type="button" aria-label="Collapse panel" aria-expanded="true">
        <span class="collapse-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </span>
      </button>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Bar: Pure Icon Actions (Theme & Profile) -->
      <header class="topbar">
        <div class="top-actions">
          <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme">
            <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8A9.03 9.03 0 0 0 12 3z"/></svg>
          </button>
          <button class="icon-btn" type="button" aria-label="Personal profile">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c.8-3.4 3.3-5 8-5s7.2 1.6 8 5"/></svg>
          </button>
        </div>

      <!-- Banknote Watermark (Solid White Shadow) -->
      <div class="watermark-container" aria-hidden="true">
        <div class="watermark-text">FRIDAY</div>
      </div>

      <!-- Centered Hero Section -->
      <section class="hero-container">
        <div class="welcome-pill">Welcome to FRIDAY</div>

        <h1 class="brand-title">
          <img src="/files/black.png" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src='/files/black.png';}" alt="FRIDAY" class="hero-logo-img" />
        </h1>

        <p class="hero-description">
          Your personalised portal to plan courses, track deadlines, discover free labs, and manage academic services in one place.

        <div class="quote-pill">
          &ldquo;Your future self is counting on what you do today. Make it worth the wait.&rdquo;
        </div>

        <div class="sub-meta">
          <button type="button">Support FRIDAY</button>
          <span>&bull;</span>
          <button type="button">Join Community</button>
        </div>

        <div class="hero-actions">
          <a class="btn-primary" href="#schedules">
            <span>Open Schedules</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
          <a class="btn-secondary" href="#portal">
            <span>Open Portal</span>
          </a>
        </div>

        <div class="quick-chips">
          <button class="quick-chip" type="button">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            <span>Planner</span>
          </button>
          <button class="quick-chip" type="button">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Deadlines</span>
          </button>
          <button class="quick-chip" type="button">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/></svg>
            <span>Notices</span>
          </button>
          <button class="quick-chip" type="button">
            <svg viewBox="0 0 24 24"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c0 3 3 5 6 5s6-2 6-5v-5"/></svg>
            <span>Degree Tracker</span>
          </button>
          <button class="quick-chip" type="button">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="M8 14h2M14 14h2"/></svg>

      <!-- Centered Bottom Links -->
      <nav class="bottom-links" aria-label="Legal and support links">
        <button type="button">About</button>
        <button type="button">Privacy policy</button>
        <button type="button">Terms and conditions</button>
        <button type="button">Support</button>

    </main>
  </div>

  <script>
    // Sidebar collapse toggle
    const sidebar = document.getElementById('portalSidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    toggleBtn.addEventListener('click', () => {
      const isCollapsed = sidebar.classList.toggle('collapsed');
      toggleBtn.setAttribute('aria-expanded', !isCollapsed);
    });

    // Theme toggle (Dark / Light)
    const html = document.documentElement;
    const themeBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    const sunIcon = `<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>`;
    const moonIcon = `<path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8A9.03 9.03 0 0 0 12 3z"/>`;

    themeBtn.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      themeIcon.innerHTML = next === 'dark' ? moonIcon : sunIcon;
    });
  </script>
</body>
</html>
